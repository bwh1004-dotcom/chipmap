<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080f1e">
<title>CHIPMAP 칩맵</title>
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="apple-mobile-web-app-title" content="CHIPMAP">
<meta name="author" content="UNO_DEYA">
<meta name="description" content="반도체 산업 A to Z · UNO_DEYA">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080f1e;--bg2:#0d1628;--bg3:#162035;--card:#1a2640;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#e8edf5;--text2:#7a8fa8;--text3:#4a5f78;
  --blue:#4f8ef7;--purple:#9b6ef7;--cyan:#26c9e8;
  --green:#2dd98a;--amber:#f5a623;--red:#f46b6b;--pink:#e86fa8;
}
#binary-rain{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.18;pointer-events:none}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;max-width:540px;margin:0 auto}
#root{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
.header{padding:13px 16px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;background:linear-gradient(135deg,#0d1628 0%,#101e38 100%)}
.logo{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:linear-gradient(135deg,#4f8ef7,#9b6ef7)}
.logo-text{font-size:16px;font-weight:800;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.2px;margin-top:1px}
.pureun-toggle{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid var(--border2);border-radius:20px;padding:5px 10px;cursor:pointer;transition:all .25s;user-select:none}
.pureun-toggle.on{background:rgba(232,111,168,.15);border-color:rgba(232,111,168,.4)}
.pureun-toggle-dot{width:18px;height:18px;border-radius:50%;background:var(--text3);transition:all .25s;display:flex;align-items:center;justify-content:center;font-size:11px}
.pureun-toggle.on .pureun-toggle-dot{background:var(--pink)}
.pureun-toggle-label{font-size:11px;font-weight:600;color:var(--text2);transition:color .25s}
.pureun-toggle.on .pureun-toggle-label{color:var(--pink)}
.pureun-banner{background:linear-gradient(135deg,rgba(232,111,168,.12),rgba(155,110,247,.08));border-bottom:1px solid rgba(232,111,168,.2);padding:7px 16px;font-size:11px;color:var(--pink);display:flex;align-items:center;gap:6px;flex-shrink:0;animation:slideDown .3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.section{padding:14px 15px 24px;display:none}
.section.active{display:block}
.sec-label{font-size:11px;color:var(--text3);margin-bottom:10px;letter-spacing:.3px;font-weight:600;text-transform:uppercase}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)}
.card.open{border-color:rgba(79,142,247,.4)}
.card.open.pureun-open{border-color:rgba(232,111,168,.4)}
.card-header{display:flex;align-items:center;gap:10px;cursor:pointer}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-title{font-size:14px;font-weight:700;flex:1}
.card-chevron{font-size:11px;color:var(--text3);transition:transform .2s}
.card.open .card-chevron{transform:rotate(180deg)}
.card-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.card.open .card-body{display:block}
.body-text{font-size:12px;color:var(--text2);line-height:1.75;white-space:pre-wrap}
.pureun-text{font-size:13px;color:var(--text);line-height:1.85;background:rgba(232,111,168,.08);border-radius:10px;padding:10px 12px;border:1px solid rgba(232,111,168,.2)}
.point{display:flex;gap:6px;font-size:11px;color:var(--text2);margin-top:5px;align-items:flex-start;line-height:1.5}
.point-dot{flex-shrink:0;margin-top:1px}
table.info{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:8px}
table.info tr{border-bottom:1px solid var(--border)}
table.info td{padding:5px 7px}
table.info td:first-child{color:var(--text3);font-weight:600;white-space:nowrap}
table.info td.mem{color:var(--cyan);text-align:center}
table.info td.logic{color:var(--purple);text-align:center}
.cycle-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.cycle-bar{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:14px}
.geo-row{padding:7px 0;border-bottom:1px solid var(--border)}
.geo-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.chain-scroll{overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chain-flow{display:flex;gap:5px;align-items:center;min-width:max-content}
.chain-node{background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:68px;transition:all .2s}
.chain-node.sel{border-width:2px}
.chain-node-label{font-size:11px;font-weight:700;margin-bottom:2px}
.chain-node-sub{font-size:9px;color:var(--text3)}
.chain-arrow{color:var(--text3);font-size:12px;flex-shrink:0}
.chain-detail{border-radius:12px;padding:12px 14px;margin-bottom:10px}
.proc-toggle{display:flex;gap:6px;margin-bottom:10px}
.proc-pill{font-size:11px;padding:5px 14px;border-radius:20px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-weight:600;transition:all .2s}
.proc-step{border-radius:10px;margin-bottom:6px;overflow:hidden;transition:all .2s;border:1px solid var(--border)}
.proc-step.sel{border-width:1.5px}
.proc-header{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer}
.proc-no{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.proc-body{padding:0 12px 12px;border-top:1px solid var(--border)}
.proc-desc{font-size:12px;color:var(--text2);line-height:1.65;padding:8px 0 10px}
.proc-pureun{font-size:12px;color:var(--text);background:rgba(232,111,168,.08);border-radius:8px;padding:8px 10px;margin-bottom:10px;border:1px solid rgba(232,111,168,.18);line-height:1.65}
.co-section{margin-bottom:14px}
.co-section-title{font-size:11px;font-weight:700;color:var(--text3);padding:6px 0 6px;letter-spacing:.4px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.co-section-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.co-card{background:var(--bg2);border-radius:10px;padding:9px 10px;border:1px solid var(--border);border-left-width:2.5px}
.co-ticker{font-size:9px;font-weight:700;font-family:monospace;margin-bottom:2px}
.mkt-badge{font-size:8px;padding:1px 5px;border-radius:5px;font-weight:700;display:inline-block;margin-bottom:3px}
.co-name{font-size:12px;font-weight:700;margin-bottom:1px}
.co-role{font-size:10px;color:var(--text3)}
.co-mc{font-size:9px;color:var(--text3);margin-top:3px}
.market-toggle{display:flex;gap:5px;margin-bottom:10px}
.mkt-btn{flex:1;padding:7px 4px;border-radius:9px;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:11px;font-weight:600;text-align:center;transition:all .2s}
.seg-scroll{overflow-x:auto;margin-bottom:10px}
.seg-row{display:flex;gap:5px;min-width:max-content}
.seg-btn{font-size:10px;padding:4px 9px;border-radius:15px;cursor:pointer;background:var(--bg2);color:var(--text2);border:1px solid var(--border);white-space:nowrap;transition:all .2s}
.seg-btn.active{background:rgba(79,142,247,.15);color:var(--blue);border-color:rgba(79,142,247,.4)}
.co-count{font-size:10px;color:var(--text3);margin-bottom:10px}
.codes-box{background:var(--bg2);border-radius:10px;padding:12px;border:1px solid var(--border);margin-top:8px}
.codes-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2)}
.code-list{font-size:10px;font-family:monospace;color:var(--text2);line-height:1.9;margin-top:10px;background:var(--bg3);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre}
/* ── STEP LEARNING ── */
.learn-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.learn-prog-row{padding:12px 16px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.learn-prog-bar{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.learn-prog-fill{height:100%;border-radius:2px;transition:width .5s ease}
.learn-prog-txt{font-size:11px;font-weight:700;white-space:nowrap}
.learn-step-map{display:flex;gap:5px;padding:10px 16px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border)}
.learn-dot{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;flex-shrink:0;border:1.5px solid var(--border)}
.learn-dot.done{background:rgba(45,217,138,.15);border-color:rgba(45,217,138,.4);color:var(--green)}
.learn-dot.curr{border-width:2px;color:#fff}
.learn-dot.todo{color:var(--text3)}
.learn-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.learn-hero{padding:18px 16px 14px}
.learn-hero-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.learn-hero-emoji{font-size:34px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.learn-hero-title{font-size:19px;font-weight:800;line-height:1.2;margin-bottom:3px}
.learn-hero-sub{font-size:11px;color:var(--text3)}
.learn-cards{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.learn-card{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--border);transition:border-color .25s,background .25s}
.learn-card.pureun-card{background:rgba(232,111,168,.06);border-color:rgba(232,111,168,.3)}
.learn-card-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.learn-card-ico{font-size:20px;width:30px;text-align:center;flex-shrink:0}
.learn-card-title{font-size:13px;font-weight:700}
.learn-card-body{font-size:12px;color:var(--text2);line-height:1.75}
.learn-pureun-body{font-size:12px;background:rgba(232,111,168,.08);border-radius:8px;padding:8px 10px;line-height:1.75;border:1px solid rgba(232,111,168,.15)}
.learn-takeaway{margin:10px 16px 16px;padding:11px 14px;border-radius:12px;border-left:3px solid;font-size:12px;line-height:1.6}
.learn-takeaway strong{font-size:13px;font-weight:800;display:block;margin-bottom:3px}
.learn-nav{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0}
.learn-btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;transition:all .2s}
.learn-btn-prev{background:var(--bg2);color:var(--text2)}
.learn-btn-next{color:#fff}
.learn-btn:disabled{opacity:.25;cursor:default}
.learn-done-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;flex:1}
.learn-done-emoji{font-size:56px;margin-bottom:16px}
.learn-done-title{font-size:22px;font-weight:800;margin-bottom:6px}
.learn-done-sub{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:24px}
.learn-restart-btn{padding:12px 28px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}
/* ── ONBOARDING ── */
.ob-wrap{height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ob-screen{flex:1;display:flex;flex-direction:column;padding:0 24px;animation:obIn .35s ease}
@keyframes obIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ob-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
.ob-logo-big{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#4f8ef7,#9b6ef7);margin-bottom:18px;box-shadow:0 8px 32px rgba(79,142,247,.25)}
.ob-app-name{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-bottom:4px}
.ob-app-sub{font-size:11px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:18px}
.ob-tagline{font-size:15px;color:var(--text2);line-height:1.7;max-width:280px}
.ob-tagline strong{color:var(--text);font-weight:700}
.ob-features{flex:1;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:8px 0}
.ob-feat{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border-radius:12px;border:1px solid var(--border);animation:obIn .35s ease both}
.ob-feat-icon{font-size:22px;width:36px;text-align:center;flex-shrink:0}
.ob-feat-title{font-size:13px;font-weight:700;margin-bottom:2px}
.ob-feat-desc{font-size:11px;color:var(--text2)}
.ob-modes{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 0}
.ob-mode-card{padding:20px 16px;border-radius:14px;border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .2s;background:var(--card)}
.ob-mode-card.sel-normal{border-color:var(--blue);background:rgba(79,142,247,.1)}
.ob-mode-card.sel-pureun{border-color:var(--pink);background:rgba(232,111,168,.1)}
.ob-mode-icon{font-size:32px;margin-bottom:8px}
.ob-mode-title{font-size:15px;font-weight:800;margin-bottom:4px}
.ob-mode-desc{font-size:11px;color:var(--text2);line-height:1.6}
.ob-mode-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block;margin-top:6px}
.ob-footer{padding:16px 0 calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.ob-dots{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.ob-dot{height:6px;border-radius:3px;background:var(--text3);transition:all .3s}
.ob-dot.act{width:20px;background:var(--blue)}
.ob-dot:not(.act){width:6px}
.ob-btn-main{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;font-size:15px;font-weight:700;letter-spacing:-.2px;transition:all .2s}
.ob-btn-primary{background:linear-gradient(135deg,#4f8ef7,#9b6ef7);color:#fff}
.ob-btn-pureun{background:linear-gradient(135deg,#e86fa8,#9b6ef7);color:#fff}
.ob-btn-skip{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;padding:4px;text-align:center;width:100%}
.ob-step-label{text-align:center;font-size:12px;color:var(--text3);margin-bottom:4px}
.term-toggle{display:flex;gap:5px;margin-bottom:12px;background:var(--bg2);padding:4px;border-radius:10px}
.term-mode-btn{flex:1;text-align:center;padding:7px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700;transition:all .25s;color:var(--text3)}
.term-mode-btn.active-normal{background:var(--blue);color:#fff}
.term-mode-btn.active-pureun{background:var(--pink);color:#fff}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap .search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text3)}
.search-input{width:100%;padding:9px 9px 9px 30px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.search-input:focus{border-color:var(--blue)}
.term-card{background:var(--bg2);border-radius:10px;margin-bottom:5px;border:1px solid var(--border);overflow:hidden}
.term-header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer}
.term-left{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.term-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-card.open .term-name{color:var(--blue)}
.term-card.open.pureun-mode .term-name{color:var(--pink)}
.term-cat{font-size:9px;padding:1px 6px;border-radius:8px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);flex-shrink:0}
.term-short{font-size:11px;color:var(--text2);padding:0 12px 8px}
.term-body{padding:0 12px 10px;border-top:1px solid var(--border)}
.term-detail{font-size:12px;color:var(--text);line-height:1.75;padding-top:8px}
.term-pureun-box{background:rgba(232,111,168,.07);border-radius:9px;padding:10px 12px;border:1px solid rgba(232,111,168,.2);font-size:13px;color:var(--text);line-height:1.85;padding-top:8px;margin-top:8px}
.metric-card{border-radius:12px;padding:12px 14px;margin-bottom:9px;border-left:3px solid;border-right:1px solid var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0}
.metric-box{background:var(--bg);border-radius:8px;padding:7px 8px}
.metric-box-label{font-size:9px;color:var(--text3);margin-bottom:2px}
.metric-box-val{font-size:11px;font-weight:700}
.metric-note{font-size:11px;color:var(--text2);line-height:1.55}
.history-row{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.history-year{min-width:48px;text-align:center;flex-shrink:0}
.history-phase{font-size:9px;color:var(--text3);margin-top:1px}
.history-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:14px}
.history-event{font-size:11px;color:var(--text2);line-height:1.5}
.check-item{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);align-items:flex-start;line-height:1.5}
.check-icon{flex-shrink:0;margin-top:1px;font-size:13px}
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 1px 5px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:7.5px;transition:color .2s;white-space:nowrap;min-width:0}
.nav-btn.active{color:var(--blue)}
.nav-btn.active.pureun-nav{color:var(--pink)}
.nav-icon{font-size:16px}
.co-tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600}
.divider{height:1px;background:var(--border);margin:12px 0}
</style>
</head>
<body>
<canvas id="binary-rain"></canvas>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const{useState}=React;
const C={bg:'#080f1e',bg2:'#0d1628',bg3:'#162035',card:'#1a2640',border:'rgba(255,255,255,.07)',text:'#e8edf5',text2:'#7a8fa8',text3:'#4a5f78',blue:'#4f8ef7',purple:'#9b6ef7',cyan:'#26c9e8',green:'#2dd98a',amber:'#f5a623',red:'#f46b6b',pink:'#e86fa8'};

// ═══════════════ DATA ═══════════════

  {term:'NAND Flash',cat:'제품',short:'비휘발성 메모리. SSD·스마트폰 저장장치',detail:'전원 꺼도 데이터 유지. SSD·USB·스마트폰 저장소. 3D NAND가 주류. DRAM보다 가격 사이클 변동 더 큼.',pureun:'📚 컴퓨터의 장기 기억이야! 전원 꺼도 사진·동영상이 사라지지 않는 이유야. 아빠 스마트폰 안에도 있어! 📱'},
  {term:'CoWoS',cat:'패키징',short:'GPU+HBM을 같은 기판에 묶는 TSMC 2.5D 첨단패키징',detail:'실리콘 인터포저 위에 GPU와 HBM을 나란히 배치. AI칩 필수 기술. TSMC 독점으로 공급 병목 발생.',pureun:'🤝 GPU랑 HBM이 손잡고 일하게 만들어주는 기술이야! 두 친구를 아주 가까이 붙여놓으면 훨씬 빨리 일할 수 있어. NVIDIA AI칩에 다 들어가 있어 🤖'},
  {term:'팹리스 (Fabless)',cat:'비즈니스',short:'공장 없이 설계만 하는 반도체 기업',detail:'Fab(공장)+Less(없음). 설계에 집중하고 제조는 TSMC에 위탁. NVIDIA·AMD·Qualcomm·ARM이 대표.',pureun:'✏️ 레고 설계도만 만들고 실제로 만드는 건 남한테 맡기는 친구야! 설계도만 잘 그려도 엄청 돈을 많이 버는 거야 💰'},
  {term:'파운드리 (Foundry)',cat:'비즈니스',short:'위탁 제조 전문. TSMC 선단공정 60%+',detail:'팹리스 설계를 대신 제조. 수십조 CAPEX 필요한 자본집약 산업. 가동률이 수익성 핵심.',pureun:'🏭 다른 친구가 그린 설계도대로 실제로 만들어주는 공장이야! 전 세계 스마트폰 칩의 절반이 TSMC에서 나와 😲'},
  {term:'IDM',cat:'비즈니스',short:'설계·제조·판매 모두 담당하는 종합 반도체 기업',detail:'Integrated Device Manufacturer. 삼성·SK하이닉스·인텔이 대표. 경기 사이클에 가장 직접 노출.',pureun:'🏠 설계도도 직접 그리고, 공장도 직접 갖고, 파는 것도 직접 하는 회사야! 삼성전자가 딱 이런 회사야 💪'},
  {term:'OSAT',cat:'비즈니스',short:'패키징·테스트 외주 전문기업',detail:'Outsourced Semiconductor Assembly and Test. AI 시대 HBM 첨단패키징으로 중요성 급상승.',pureun:'🎁 칩을 예쁘게 포장해서 테스트하는 회사야! 잘못된 칩은 여기서 걸러내고 안전하게 포장해서 내보내 📦'},
  {term:'수율 (Yield)',cat:'공정',short:'웨이퍼에서 정상 칩 비율. 수율=원가·수익성 직결',detail:'웨이퍼 1장 정상 다이÷전체 다이. 신공정 초기에 낮고 점진적 개선. 파운드리 경쟁력 핵심 지표.',pureun:'🍪 쿠키 100개 구웠는데 80개만 예쁘게 나오면 수율 80%야! 반도체도 똑같아. 많이 잘 나올수록 돈을 더 버는 거야 😄'},
  {term:'EDA (설계자동화)',cat:'설계',short:'반도체 설계 자동화 소프트웨어. Synopsys·Cadence 과점',detail:'수십억 트랜지스터 칩을 자동으로 설계. 팹리스·IDM 모두 필수 구독. 안정적 과점 구조.',pureun:'🖥️ 복잡한 설계도 그리는 걸 컴퓨터가 도와주는 프로그램이야! 이게 없으면 칩 설계가 불가능해 🎮'},
  {term:'Book-to-Bill',cat:'투자',short:'수주÷출하. 1.0 초과=장비 호황 신호',detail:'반도체 장비업황 선행지표. SEMI 매월 발표. 1.2 이상이면 강한 호황 신호.',pureun:'📋 주문이 더 많냐, 배달이 더 많냐 보는 거야! 1.0보다 크면 앞으로 더 바빠진다는 뜻이야 📈'},
  {term:'ASP (평균판매단가)',cat:'투자',short:'반도체 평균 판매가격. 가격 사이클 핵심 지표',detail:'메모리 투자에서 가장 중요한 지표. HBM은 일반 DRAM의 3~5배. 분기 실적에서 반드시 체크.',pureun:'💰 반도체 하나의 평균 가격이야! 이 숫자가 올라가면 회사가 돈을 더 많이 버는 거야. 이것만 잘 봐도 투자를 잘할 수 있대 📊'},
  {term:'CAPEX (설비투자)',cat:'투자',short:'공장·장비 투자비. 급증 후 2~3년 뒤 공급과잉 주의',detail:'TSMC 연 30~40조, 삼성 40~50조. CAPEX 급증→공급과잉→가격하락 패턴 반복.',pureun:'🏗️ 공장 짓거나 기계 사는 돈이야! 너무 많이 지으면 나중에 반도체가 넘쳐서 가격이 떨어지기도 해 😅'},
  {term:'TC본더',cat:'장비',short:'HBM 적층 핵심 장비. 한미반도체 독점 공급',detail:'Thermal Compression Bonder. HBM 칩을 수직으로 쌓을 때 열·압력으로 정밀하게 접합. 한미반도체 독점.',pureun:'🔨 HBM을 층층이 쌓을 때 꽉 붙여주는 기계야! 이 기계는 한미반도체라는 한국 회사만 만들어서 전 세계가 사가 🇰🇷'},
  {term:'노광 (Lithography)',cat:'공정',short:'빛으로 웨이퍼에 회로 패턴을 인쇄하는 핵심 공정',detail:'포토마스크에 그려진 회로 패턴을 빛으로 감광재에 전사. 파장이 짧을수록 더 미세한 패턴 구현.',pureun:'📷 도장 찍는 거랑 비슷해! 회로 모양이 새겨진 도장에 특별한 빛을 쏘면 웨이퍼에 그 모양이 찍히는 거야 🔬'},
  {term:'CVD / ALD',cat:'공정',short:'박막을 웨이퍼에 층층이 쌓는 증착 기술',detail:'CVD: 반응가스로 박막 형성. ALD: 원자 1개층씩 정밀 증착. 공정 미세화로 ALD 수요 급증.',pureun:'🧁 케이크에 크림을 한 층씩 바르는 거랑 같아! ALD는 원자 하나 두께로 아주아주 얇게 바르는 거야 🍰'},
  {term:'SoC (시스템온칩)',cat:'제품',short:'CPU·GPU·NPU 등을 하나의 칩에 통합',detail:'스마트폰 AP가 대표적. Qualcomm Snapdragon·Apple A시리즈·삼성 Exynos. 소형화·저전력 핵심.',pureun:'🎒 모든 걸 하나의 가방에 넣은 거야! CPU·GPU·통신을 하나의 작은 칩에 다 넣어서 폰을 얇게 만드는 거야 😊'},
  {term:'전구체 (Precursor)',cat:'소재',short:'ALD·CVD 공정 원료 화학물질',detail:'ALD·CVD에서 반응가스로 주입돼 박막을 형성. 미세화로 고순도 전구체 수요 증가. 디엔에프·레이크머티리얼즈.',pureun:'🧪 케이크 반죽 같은 재료야! 이 특별한 화학 재료를 넣어야 웨이퍼 위에 얇은 막이 생기거든 👨‍🍳'},
  {term:'수율 vs 가동률',cat:'투자',short:'수율=정상칩 비율 / 가동률=공장 가동 비율',detail:'수율(Yield): 파운드리 경쟁력 핵심. 가동률(Utilization): 높을수록 수익성 좋음. 둘 다 올라야 진짜 호황.',pureun:'🏭 수율은 빵이 맛있게 나왔냐, 가동률은 오븐을 쉬지 않고 돌렸냐야! 둘 다 좋아야 빵집이 돈을 잘 버는 거야 🍞'},
  {term:'FC-BGA (기판)',cat:'기판',short:'고성능 반도체용 플립칩 볼그리드어레이 기판',detail:'AI칩 수요 폭증으로 FC-BGA 공급 타이트. 삼성전기·LG이노텍·심텍·이수페타시스 수혜.',pureun:'🍱 칩을 담는 도시락 같은 거야! AI칩이 많이 팔릴수록 이 도시락도 더 많이 필요해. 한국 기업들이 잘 만들어 🇰🇷'},
  {term:'NF3 (삼불화질소)',cat:'소재',short:'반도체 챔버 세정용 필수 특수가스',detail:'공정 장비 내부 챔버 세정에 사용. CVD·ALD 공정 늘수록 수요 증가. 후성·SK머티리얼즈 국내 공급.',pureun:'🧹 반도체 만드는 기계 안을 청소하는 특별한 가스야! 기계를 깨끗하게 해야 좋은 칩이 나오거든 ✨'},
  {term:'블랭크마스크',cat:'소재',short:'EUV 노광용 마스크 원판. 에스앤에스텍 국내 독점',detail:'EUV 포토마스크 제작 전 단계 원판. 극도로 높은 평탄도·청정도 요구. 국산화 소재.',pureun:'🖼️ 회로 그림을 찍는 도장의 원판이야! 에스앤에스텍이라는 한국 회사가 만드는 아주 특별한 소재야 🇰🇷'},

  // ── 공정·기술 ──
  {term:'CMP (화학기계연마)',cat:'공정',short:'웨이퍼 표면을 화학+물리력으로 평탄화하는 공정',detail:'Chemical Mechanical Planarization. 증착 후 표면 울퉁불퉁함을 연마. 다층 배선 구조 필수 공정. 슬러리(연마액)·패드 소재 국산화 진행 중.',pureun:'🪥 울퉁불퉁한 웨이퍼 표면을 특별한 약물로 문질러서 반들반들하게 만드는 거야! 이걸 안 하면 그 위에 회로를 못 그려 😊'},
  {term:'TSV (실리콘관통전극)',cat:'공정',short:'칩을 수직으로 관통하는 전극. HBM 핵심 기술',detail:'Through Silicon Via. 칩을 위아래로 뚫어 전기 통로 형성. HBM 수직 적층의 핵심. 기존 와이어본딩 대비 속도·전력 효율 획기적 개선.',pureun:'🏢 칩을 엘리베이터로 연결한 거야! 층층이 쌓인 칩 사이를 구멍 뚫어서 전기가 위아래로 빠르게 다닐 수 있게 해줘 ⚡'},
  {term:'식각 (Etching)',cat:'공정',short:'불필요한 박막을 화학·물리적으로 제거하는 공정',detail:'노광 후 불필요한 부분을 제거해 회로 패턴 형성. 건식(플라즈마)·습식(약액) 두 종류. 미세화로 건식 식각 비중 증가. Lam Research·TEL·피에스케이 핵심.',pureun:'✂️ 회로 모양대로 필요 없는 부분을 잘라내는 거야! 조각가가 돌을 깎아서 모양 만드는 것처럼, 반도체도 깎아서 회로를 만들어 🗿'},
  {term:'도핑 (Doping)',cat:'공정',short:'실리콘에 불순물을 주입해 전기 특성 조절',detail:'순수 실리콘은 전기 안 흐름. 붕소(B)·인(P) 등 불순물 주입으로 P형·N형 반도체 생성. 트랜지스터 동작의 근본 원리.',pureun:'🧂 맹물에 소금을 넣으면 전기가 흐르는 것처럼, 실리콘에 특별한 물질을 넣으면 전기가 흐르게 돼! 얼마나 넣느냐로 성질이 바뀌어 💡'},
  {term:'클린룸 (Clean Room)',cat:'공정',short:'먼지 입자를 극도로 통제한 반도체 제조 환경',detail:'나노미터 단위 먼지도 칩을 망가뜨림. Class 1(1세제곱피트당 먼지 1개 이하) 유지. 양압 유지·특수 복장 필수. 건설비만 수조원.',pureun:'🏥 병원 수술실보다 100만 배 더 깨끗한 방이야! 먼지 하나만 들어가도 칩이 망가지거든. 들어갈 때 우주복 같은 옷을 입어야 해 👨‍🚀'},
  {term:'포토레지스트 (PR)',cat:'소재',short:'노광 시 빛에 반응하는 감광재. JSR·동진쎄미켐',detail:'빛에 노출된 부분이 변성되는 화학물질. 양성(빛 맞은 부분 제거)·음성(빛 맞은 부분 유지) 두 종류. EUV용 PR은 일본 의존도 높음.',pureun:'📸 웨이퍼에 바르는 특별한 물감이야! 빛을 쬐면 색이 변해서 회로 모양을 나타낼 수 있어. 사진 필름이랑 비슷한 원리야 📷'},
  {term:'열처리 (Annealing)',cat:'공정',short:'고온으로 반도체 내부 결함을 치유하는 공정',detail:'이온주입 후 손상된 결정 구조 복원. 900~1200℃ 고온 처리. 비아트론·유진테크 등 국내 장비사 경쟁력 보유.',pureun:'🔥 다친 반도체를 뜨거운 곳에 넣어서 낫게 해주는 거야! 우리가 다치면 치료받는 것처럼, 칩도 뜨거운 치료를 받아야 건강해져 💊'},
  {term:'산화 (Oxidation)',cat:'공정',short:'실리콘 표면에 산화막(SiO₂)을 형성하는 공정',detail:'실리콘을 고온 산소 분위기에서 가열해 절연층 형성. 트랜지스터 게이트 절연막의 핵심. 두께는 수 나노미터 수준.',pureun:'🍎 사과를 놔두면 갈색으로 변하잖아? 실리콘도 산소를 만나면 표면이 변해! 그 변한 표면이 전기를 막아주는 절연막이 돼 🛡️'},

  // ── AI 반도체 ──
  {term:'GPU (그래픽처리장치)',cat:'AI반도체',short:'병렬연산 특화 프로세서. AI 학습·추론의 핵심',detail:'수천 개 코어로 행렬연산 동시 처리. AI 학습에 필수. NVIDIA가 H100·B200으로 시장 90% 장악. 데이터센터 GPU 수요가 반도체 슈퍼사이클 견인.',pureun:'🎮 원래는 게임 그래픽용이었는데, AI가 수학 계산을 엄청 많이 해야 해서 GPU가 AI의 뇌가 됐어! NVIDIA가 이걸 제일 잘 만들어 🧠'},
  {term:'NPU (신경망처리장치)',cat:'AI반도체',short:'AI 연산에 특화된 전용 프로세서',detail:'Neural Processing Unit. CPU·GPU보다 AI 추론에 특화·저전력. 스마트폰 AP 내장(삼성 Exynos·Apple A시리즈). 온디바이스 AI 핵심.',pureun:'🤖 AI만을 위해 만든 특별한 뇌야! 일반 컴퓨터(CPU)보다 AI 계산을 훨씬 빠르고 전기도 적게 쓰면서 할 수 있어. 지금 스마트폰에도 들어있어 📱'},
  {term:'AI 가속기',cat:'AI반도체',short:'AI 연산을 빠르게 처리하는 전용 반도체',detail:'GPU·NPU·TPU 통칭. 데이터센터용은 NVIDIA H100/B200, 엣지용은 각사 NPU. AI 모델 크기 커질수록 가속기 수요 급증.',pureun:'🚀 AI가 생각하는 속도를 빠르게 해주는 반도체야! AI가 답을 내놓으려면 엄청난 계산이 필요한데, 이 칩이 그걸 빠르게 해줘 ⚡'},
  {term:'학습 vs 추론',cat:'AI반도체',short:'Training=AI 공부 / Inference=AI 실전 사용',detail:'학습(Training): 대규모 GPU 클러스터 필요. 수개월·수천억 비용. 추론(Inference): 엣지·모바일에서도 가능. 시장 규모는 추론이 더 큼. 투자 관점에선 추론칩 수혜주 주목.',pureun:'📖 학습은 AI가 공부하는 것, 추론은 시험 보는 거야! 공부할 땐 엄청난 GPU가 필요하고, 시험 볼 땐 스마트폰으로도 가능해. 추론 시장이 더 크대 🎓'},
  {term:'온디바이스 AI',cat:'AI반도체',short:'클라우드 없이 기기 자체에서 AI 처리',detail:'스마트폰·PC에서 직접 AI 추론. 개인정보 보호·빠른 응답속도 장점. Apple·삼성·Qualcomm NPU 탑재 확대. 엣지 AI반도체 수요 증가 트렌드.',pureun:'📱 인터넷 없어도 스마트폰 안에서 AI가 혼자 생각하는 거야! 사진 찍으면 바로 편집해주고, 말하면 바로 번역해주는 게 다 온디바이스 AI야 ✨'},
  {term:'HBM3E',cat:'제품',short:'5세대 HBM. SK하이닉스 세계 최초 양산',detail:'HBM 최신 규격. 초당 1.2TB 대역폭. NVIDIA B100·B200에 탑재. SK하이닉스가 삼성·마이크론보다 6개월 이상 앞서 공급. AI 인프라 병목 해소 핵심.',pureun:'🏆 HBM의 최신 버전이야! 데이터를 더 빠르게 더 많이 전달할 수 있어. SK하이닉스가 세계에서 제일 먼저 만들었어 🇰🇷'},
  {term:'CXL (컴퓨트익스프레스링크)',cat:'AI반도체',short:'CPU-메모리-가속기를 고속 연결하는 차세대 인터페이스',detail:'Compute Express Link. 서버에서 CPU와 GPU·메모리를 빠르게 연결. 메모리 용량 확장 가능. 차세대 데이터센터 아키텍처 핵심.',pureun:'🔌 컴퓨터 부품들을 빠른 고속도로로 연결하는 기술이야! CPU·GPU·메모리가 서로 데이터를 더 빨리 주고받을 수 있어. AI 서버에서 점점 중요해지고 있어 🚗'},

  // ── 투자·시장 ──
  {term:'슈퍼사이클',cat:'투자',short:'반도체 업황이 수년간 지속되는 초장기 호황',detail:'스마트폰(2016~17)·AI(2023~) 등 새로운 수요 트리거가 등장할 때 발생. 일반 호황(1~2년)과 달리 3~5년 지속. 현재 AI 드리븐 슈퍼사이클 진행 중.',pureun:'🎢 반도체 회사들이 아주 오랫동안 돈을 많이 버는 시기야! 스마트폰이 처음 나왔을 때도 이랬고, 지금 AI 때문에 또 이러고 있어 📈'},
  {term:'감산 (减産)',cat:'투자',short:'공급 과잉 시 생산량을 의도적으로 줄이는 전략',detail:'재고 급증 시 가격 하락 방어 목적. 삼성(2023년 역대급 감산)·SK하이닉스. 감산 발표 후 6~12개월 뒤 가격 반등이 역사적 패턴. 투자 타이밍 핵심 신호.',pureun:'🏪 물건이 너무 많이 쌓이면 가격이 떨어지잖아! 그래서 반도체 회사들이 일부러 덜 만들어서 가격을 지켜. 뉴스에 "감산"이 나오면 곧 가격이 오를 수도 있다는 신호야 📊'},
  {term:'재고조정',cat:'투자',short:'고객사 과잉재고 소진 국면. 업황 바닥 신호',detail:'반도체 고객사(스마트폰·서버 제조사)가 이전에 쌓아둔 재고를 소진하는 기간. 이 기간엔 신규 주문 감소. 재고조정 종료=신규 주문 시작=업황 반등 시그널.',pureun:'🗄️ 삼성이 반도체를 너무 많이 사놨다가 쓰는 기간이야! 창고에 쌓아둔 걸 다 쓰고 나서야 새로 주문해. 그 기간이 끝나면 반도체 회사들이 다시 바빠져 📦'},
  {term:'메모리 가격 사이클',cat:'투자',short:'DRAM·NAND 가격이 호황·불황을 반복하는 패턴',detail:'공급과잉→가격하락→감산→공급부족→가격상승 반복. 평균 3~4년 주기. 저점(PBR 1배 미만) 매수·고점(PBR 2배 이상) 매도가 메모리 투자 기본 전략.',pureun:'🎡 반도체 가격이 올라갔다 내려갔다 반복하는 놀이기구 같아! 규칙적으로 움직이니까 이 패턴을 알면 언제 사고 팔지 예측할 수 있대 🎯'},
  {term:'웨이퍼 출하량 (WSE)',cat:'투자',short:'전 세계 웨이퍼 출하량. 반도체 경기 선행지표',detail:'SEMI 월간 발표. 출하량 증가=장비·소재 수요 증가 선행. 웨이퍼 출하량 → 장비 발주 → 소재 구매 순으로 파급.',pureun:'📏 전 세계에서 얼마나 많은 웨이퍼(쿠키판)가 팔렸는지 보는 거야! 많이 팔릴수록 반도체를 많이 만든다는 뜻이라 장비·소재 회사들이 좋아해 📈'},
  {term:'테이프아웃 (Tape-out)',cat:'비즈니스',short:'칩 설계 완료 후 파운드리에 생산 의뢰하는 시점',detail:'팹리스가 설계를 끝내고 TSMC 등 파운드리에 마스크 데이터를 넘기는 단계. 이후 실제 칩 생산까지 3~6개월 소요. 테이프아웃 수=파운드리 가동률 선행지표.',pureun:'📬 설계도를 완성해서 공장에 "이대로 만들어!" 하고 보내는 순간이야! 이걸 한 번 하는 데 수십억~수백억이 들어서 실수하면 안 돼 😰'},
  {term:'IP코어 (반도체 IP)',cat:'비즈니스',short:'반복 사용 가능한 설계 블록. ARM이 대표',detail:'Intellectual Property Core. CPU·GPU·통신 블록 등 설계 자산. ARM이 CPU 코어 IP 라이선스로 전 세계 모바일칩 시장 지배. 팹리스가 IP를 조합해 SoC 설계.',pureun:'🧩 레고 부품 같은 거야! 반도체 설계의 부품들이 있는데, ARM이 CPU 부품을 만들어서 전 세계 회사들에 빌려줘. 스마트폰 칩 거의 전부에 ARM 부품이 들어가 있어 📱'},
  {term:'칩렛 (Chiplet)',cat:'패키징',short:'큰 칩을 작은 조각으로 나눠 조합하는 설계 방식',detail:'하나의 큰 다이 대신 기능별 작은 칩을 패키징으로 연결. 수율 개선·비용 절감. AMD가 Zen 아키텍처에 먼저 적용. 인텔 Foveros, TSMC SoIC도 칩렛 기반.',pureun:'🍕 피자를 한 판으로 굽는 대신 조각조각 따로 만들어서 합치는 거야! 작게 만들수록 잘 나오는 비율이 높아져. AMD가 이 방식으로 인텔을 따라잡았어 🎯'},
  {term:'3D 패키징',cat:'패키징',short:'칩을 수직으로 쌓아 하나처럼 동작시키는 기술',detail:'2.5D(같은 기판 위 나란히)·3D(수직 적층) 두 종류. HBM이 대표적 3D 패키징. 단순 평면 배치보다 성능·전력효율 획기적 개선. AI 시대 첨단패키징 수요 폭증.',pureun:'🏢 아파트처럼 칩을 위로 쌓는 기술이야! 평면에 나란히 놓는 것보다 위로 쌓으면 더 빠르고 전기도 덜 써. AI 때문에 이 기술이 엄청 중요해졌어 🤖'},
  {term:'Fan-Out WLP',cat:'패키징',short:'칩을 기판 없이 직접 수지로 감싸는 패키징',detail:'Wafer Level Packaging. 기판(Substrate) 없이 칩 주변을 에폭시로 재구성. 더 얇고 저렴. TSMC InFO, 네패스 FO-WLP가 대표. 스마트폰 AP에 주로 적용.',pureun:'🍱 도시락 통(기판) 없이 칩을 직접 감싸서 포장하는 기술이야! 더 얇고 싸게 만들 수 있어서 스마트폰 얇아지는 데 도움을 줘 📱'},
  {term:'SiP (시스템인패키지)',cat:'패키징',short:'여러 칩을 하나의 패키지에 통합',detail:'System in Package. CPU·메모리·통신 칩 등을 하나의 패키지로 묶음. SoC(하나의 칩에 통합)와 달리 다른 칩들을 패키징으로 연결. 애플 애플워치가 대표 사례.',pureun:'🎁 여러 개의 칩을 한 상자에 담는 거야! SoC가 하나의 칩에 전부 그리는 거라면, SiP는 따로 만든 칩들을 한 박스에 넣는 거야. 애플워치가 이렇게 만들어 ⌚'},

  // ── 제품·규격 ──
  {term:'LPDDR (저전력 DRAM)',cat:'제품',short:'모바일용 저전력 DRAM. 스마트폰·태블릿 탑재',detail:'Low Power DDR. 일반 DDR 대비 전력 50% 절감. 스마트폰 배터리 수명 핵심. LPDDR5X가 현재 주류. 삼성·SK하이닉스·마이크론 공급.',pureun:'🔋 스마트폰용 특별 메모리야! 일반 컴퓨터 메모리보다 전기를 훨씬 적게 써서 배터리가 오래가게 해줘. 아빠 폰 안에도 들어있어 😊'},
  {term:'DDR5',cat:'제품',short:'PC·서버용 5세대 DRAM. DDR4 대비 2배 속도',detail:'PC·서버 메인메모리 최신 규격. 6400Mbps 이상. AI 서버·고성능 PC 전환 가속. DDR4→DDR5 전환이 메모리 ASP 상승 요인.',pureun:'🚀 컴퓨터 메모리의 최신 버전이야! 예전 버전보다 2배 빨라졌어. 새 컴퓨터 살 때 DDR5가 들어있으면 더 빠른 거야 💨'},
  {term:'eSSD (기업용 SSD)',cat:'제품',short:'데이터센터용 고성능·고내구성 낸드 스토리지',detail:'Enterprise SSD. AI 학습 데이터 저장·빠른 읽기에 필수. 일반 SSD 대비 10배 이상 내구성. 서버 투자 증가로 eSSD 수요 급증. 삼성·SK하이닉스·마이크론·키오시아.',pureun:'🗄️ 서버 컴퓨터에 들어가는 특별한 저장장치야! 일반 SSD보다 훨씬 오래 쓸 수 있고 빨라. AI 서버에 데이터가 많이 쌓일수록 이게 더 많이 필요해 📦'},
  {term:'PIM (처리내장메모리)',cat:'AI반도체',short:'메모리 안에서 직접 연산하는 차세대 반도체',detail:'Processing In Memory. 데이터를 CPU·GPU로 옮기지 않고 메모리 내부에서 바로 연산. 데이터 이동 병목 해소. AI 추론 전력효율 극대화. SK하이닉스 AiM이 선도.',pureun:'🏠 도서관(메모리)에서 책 찾고 집(CPU)으로 가져오는 대신, 도서관에서 바로 공부하는 거야! 왔다갔다 안 하니까 훨씬 빨라 ⚡'},

  // ── 규제·지정학 ──
  {term:'CHIPS Act (반도체법)',cat:'지정학',short:'미국 반도체 자국 생산 지원법. 527억달러 투자',detail:'2022년 바이든 서명. 미국 내 반도체 공장 건설 보조금·세액공제. TSMC·삼성·인텔 미국 공장 건설 가속화. 미중 반도체 패권전쟁의 핵심 정책.',pureun:'🏛️ 미국이 반도체 공장을 미국 안에 짓도록 돈을 엄청 주는 법이야! 중국한테 지기 싫어서 TSMC·삼성한테도 "우리나라에 공장 지어!" 하고 돈 줬어 🇺🇸'},
  {term:'수출통제 (EAR)',cat:'지정학',short:'미국의 첨단 반도체·장비 중국 수출 규제',detail:'Export Administration Regulations. AI칩(H100 이상)·EUV 장비의 중국 수출 금지. ASML·NVIDIA 직격. 중국향 매출 비중 높은 기업 투자 시 리스크 필수 체크.',pureun:'🚫 미국이 중국한테 첨단 반도체를 팔지 말라고 하는 규칙이야! NVIDIA 최고 칩도 중국엔 못 팔아. 그래서 중국이 스스로 만들려고 엄청 노력하고 있어 🇨🇳'},
  {term:'중국 반도체 굴기',cat:'지정학',short:'중국의 반도체 자립 프로젝트. SMIC·화웨이 중심',detail:'미국 규제에 대응한 중국 자체 반도체 개발. SMIC 7nm 달성, 화웨이 Kirin 자체 설계. 소재·장비 국산화 추진. 단기엔 한국 수혜(중국 의존도 감소), 장기엔 경쟁 위협.',pureun:'💪 중국이 "우리도 반도체 직접 만들겠다!"고 엄청 노력하는 거야! 미국이 안 팔겠다니까 스스로 만들기로 한 거야. 아직은 한국·미국이 훨씬 앞서 있어 🏁'},

<script>
// ── 효과음 (Web Audio API) ──
const SFX=(function(){
  let ctx=null;
  function getCtx(){
    if(!ctx) ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function beep(freq,dur,vol,type='sine',decay){
    try{
      const c=getCtx();
      const o=c.createOscillator();
      const g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);
      g.gain.setValueAtTime(vol,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+(decay||dur));
      o.start(c.currentTime);o.stop(c.currentTime+dur);
    }catch(e){}
  }
  return{
    // 탭 전환: 짧고 깔끔한 틱
    tab:()=>{ beep(880,0.06,0.04,'sine',0.05); },
    // 카드/아코디언 열기: 살짝 올라가는 톤
    open:()=>{ beep(440,0.05,0.03,'sine',0.04); setTimeout(()=>beep(550,0.05,0.02,'sine',0.04),40); },
    // 카드/아코디언 닫기: 내려가는 톤
    close:()=>{ beep(550,0.05,0.03,'sine',0.04); setTimeout(()=>beep(440,0.05,0.02,'sine',0.04),40); },
    // 버튼 클릭: 미세한 틱
    click:()=>{ beep(660,0.04,0.025,'square',0.035); },
  };
})();

// 탭 버튼에 효과음 주입
document.addEventListener('click',function(ev){
  const btn=ev.target.closest('.nav-btn');
  if(btn) SFX.tab();
},true);
</script>

<script>
(function(){
  const canvas=document.getElementById('binary-rain');
  const ctx=canvas.getContext('2d');
  const FONT_SIZE=13;
  const CHARS='01';
  let cols,drops,W,H;

  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    cols=Math.floor(W/FONT_SIZE);
    drops=Array.from({length:cols},()=>Math.random()*-50);
  }

  function draw(){
    ctx.fillStyle='rgba(8,15,30,0.18)';
    ctx.fillRect(0,0,W,H);
    ctx.font=FONT_SIZE+'px monospace';
    for(let i=0;i<drops.length;i++){
      const ch=CHARS[Math.floor(Math.random()*CHARS.length)];
      const y=drops[i]*FONT_SIZE;
      // 앞부분(밝은 cyan) / 뒤(어두운 청록)
      const bright=drops[i]*FONT_SIZE>H*0.6;
      ctx.fillStyle=bright?'rgba(38,201,232,0.35)':'rgba(38,201,232,0.7)';
      ctx.fillText(ch,i*FONT_SIZE,y);
      if(y>H&&Math.random()>0.975) drops[i]=0;
      drops[i]+=0.4+Math.random()*0.3;
    }
  }

  resize();
  window.addEventListener('resize',resize);
  setInterval(draw,55);
})();
</script>
